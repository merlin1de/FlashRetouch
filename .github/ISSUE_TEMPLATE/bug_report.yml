name: Bug report
description: Something in FlashRetouch doesn't work the way it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Write in **English or German**, whichever suits you.

        The questions below are the ones that decide whether a bug can be reproduced.
        If you don't know an answer, leave it — a report with gaps still beats no report.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: And what did you expect instead?
      placeholder: |
        Set "D&B Gesicht" to 2 on a studio portrait. A dark spot appeared on the cheek
        that isn't in the original.
        Expected: the cheekbone lifted, nothing added.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: How to get there
      description: The shortest path you know of that shows the problem.
      placeholder: |
        1. Open a 30 MP portrait
        2. Wait for the analysis
        3. Drag "D&B Gesicht" to 2
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: FlashRetouch version
      description: The **Über…** button in the toolbar shows it, top line.
      placeholder: "0.1.2"
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: "`winver` gives you the exact one."
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: dropdown
    id: subject
    attributes:
      label: What is in the picture?
      description: The chain looks for a face first, then skin. Most problems are tied to that.
      options:
        - One person, head and shoulders
        - One person, half or full body
        - Several people
        - No face visible (back, profile, crop)
        - Something else
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: Camera and size
      description: Sensor resolution matters for speed; the camera matters for colour.
      placeholder: "Canon R6 Mk II, 24 MP JPEG out of Lightroom"

  - type: dropdown
    id: light
    attributes:
      label: Lighting
      description: Face modelling takes its strength from the light that is already there.
      options:
        - Studio, shaped light
        - Daylight, soft
        - Hard sun or flash
        - Mixed or coloured light
        - Black and white
        - Don't know
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: |
        Error message wording, if there was one. There's a log at
        `%AppData%\FlashRetouch\app.log`; the last lines around the time it happened
        are usually enough — please skim them first, they contain your folder and
        file names.

        **Please do not attach photographs of people.** See the note in the README:
        this repository is public, and an upload cannot be taken back. A description
        is almost always enough.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you send
      options:
        - label: I'm on the current version (Über… → *Nach Updates suchen*)
          required: false
        - label: I searched the existing issues
          required: false
        - label: There is no photograph of a person in this report
          required: false
